<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#cbdfe6"><title>同一座桥 · 两个人，一拍之差</title><link rel="stylesheet" href="style.css"></head><body><a href="courtyard/" style="display:block;text-align:center;background:#dac8d9;padding:12px;color:#4b475f;text-decoration:none;font-size:14px">新试玩 · 光与回声的三座小庭院 →</a>
<main><header><a href="./" class="brand"><span class="brand-icon">⇄</span> 同一座桥<small>两个人，一拍之差</small></a><button id="sound" aria-pressed="false">声音 关</button></header>
<div class="journey"><span id="progress"></span><button id="challenge">余音挑战 →</button></div><section class="heading"><div id="chapter"></div><h1 id="title"></h1><p id="voice"></p></section>
<nav id="chapters" aria-label="三个章节"></nav>
<div class="play-layout"><div class="scene-column"><section class="stage" aria-label="桥面游戏"><div class="stage-top"><span id="leader"></span><span id="score"></span></div><svg id="board" viewBox="0 35 560 230" role="img" aria-label="同一座桥上的两个人与目标光圈"></svg><div class="queue"><div class="queue-label"><span id="echoWho"></span><span>下一拍将执行</span></div><strong id="echo"></strong><span class="echo-tag">你留下的动作</span></div></section>
<p id="message" role="status" aria-live="polite"></p>
<div id="trail" aria-label="最近的操作"></div></div><div class="action-column"><div class="howto"><b>你走这一步</b><span>另一个人，走你上一步。</span></div><div class="controls"><div class="dpad" aria-label="移动"><button data-action="U" aria-label="向上">↑</button><button data-action="L" aria-label="向左">←</button><button data-action="W" aria-label="等一等">等一等<span>停一拍</span></button><button data-action="R" aria-label="向右">→</button><button data-action="D" aria-label="向下">↓</button></div><div class="side"><button id="swap" data-action="X">⇄ 换领队<small id="swapNote"></small></button><div class="utilities"><button id="undo">↶ 撤销</button><button id="reset">重来</button><button id="hint">一点提示</button></div></div></div>
<footer>方向键 / WASD 移动 · 空格 等一等 · X 换领队 · Z 撤销<br><button id="rules">玩法说明</button><span id="best"></span><a class="classic-link" href="classic/">最初的六关</a></footer></div></div>
</main>
<dialog id="modal"><div id="modalContent"></div></dialog>
<script src="engine.js"></script><script src="levels.js"></script><script src="app.js"></script></body></html>
